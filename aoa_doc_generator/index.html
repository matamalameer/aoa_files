<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد اللائحة الداخلية والأحكام العامة | حسينية ومأتم</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/components/sidebar.css">
    <link rel="stylesheet" href="src/css/components/editor.css">
    <link rel="stylesheet" href="src/css/components/document.css">
</head>
<body class="bg-gray-900 text-gray-100 dark-theme">

    <div class="app-container">
        
        <aside class="sidebar" id="sidebar">
            <header class="sidebar-header">
                <div class="brand">
                    <i class="fa-solid fa-scroll brand-icon"></i>
                    <div>
                        <h1 class="brand-title">صانع اللائحة الداخلية</h1>
                        <span class="brand-subtitle">للحسينيات والمآتم</span>
                    </div>
                </div>
                <button id="theme-toggle" class="btn-icon" title="تبديل المظهر">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </header>

            <nav class="sidebar-tabs">
                <button class="tab-btn active" data-tab="tab-metadata">
                    <i class="fa-solid fa-sliders"></i> البيانات
                </button>
                <button class="tab-btn" data-tab="tab-structure">
                    <i class="fa-solid fa-sitemap"></i> الهيكل والبناء
                </button>
                <button class="tab-btn" data-tab="tab-editor">
                    <i class="fa-solid fa-pen-to-square"></i> المحرر
                </button>
                <button class="tab-btn" data-tab="tab-export">
                    <i class="fa-solid fa-file-export"></i> التصدير
                </button>
            </nav>

            <div class="tab-contents">
                
                <section class="tab-panel active" id="tab-metadata">
                    <h2 class="panel-title">معلومات المؤسسة والوثيقة</h2>
                    
                    <form id="form-metadata" onsubmit="event.preventDefault();">
                        <div class="form-group">
                            <label for="input-org-name">اسم الحسينية / المأتم</label>
                            <input type="text" id="input-org-name" class="form-input" placeholder="مثال: مأتم كرزكان الكبير">
                        </div>

                        <div class="form-group">
                            <label for="input-doc-title">عنوان الوثيقة</label>
                            <input type="text" id="input-doc-title" class="form-input" placeholder="مثال: اللائحة الداخلية ونظام إدارة المأتم">
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="input-doc-version">رقم الإصدار</label>
                                <input type="text" id="input-doc-version" class="form-input" placeholder="1.0">
                            </div>
                            <div class="form-group">
                                <label for="input-doc-date">تاريخ الاعتماد</label>
                                <input type="date" id="input-doc-date" class="form-input">
                            </div>
                        </div>

                        <div class="form-group">
                            <label>شعار المؤسسة</label>
                            <div class="logo-uploader">
                                <div class="logo-preview-box" id="logo-preview-box">
                                    <i class="fa-solid fa-mosque default-logo-icon"></i>
                                </div>
                                <div class="logo-actions">
                                    <label for="input-logo-file" class="btn btn-secondary btn-sm">
                                        <i class="fa-solid fa-upload"></i> رفع شعار
                                    </label>
                                    <input type="file" id="input-logo-file" accept="image/*" class="hidden-input">
                                    <button type="button" id="btn-remove-logo" class="btn btn-danger-outline btn-sm hidden">
                                        <i class="fa-solid fa-trash"></i> حذف
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </section>

                <section class="tab-panel" id="tab-structure">
                    <div class="panel-header-actions">
                        <h2 class="panel-title">هيكلية الأبواب والمواد</h2>
                        <button id="btn-add-section" class="btn btn-primary btn-sm">
                            <i class="fa-solid fa-plus"></i> إضافة باب جديد
                        </button>
                    </div>

                    <div id="outline-tree-container" class="outline-tree">
                        </div>
                </section>

                <section class="tab-panel" id="tab-editor">
                    <h2 class="panel-title">تحرير المحتوى التفصيلي</h2>
                    <p class="panel-description">اختر مادة من شجرة الهيكل للبدء في كتابة نصها ومراجعتها.</p>
                    
                    <div id="editor-active-section-info" class="active-item-badge"></div>
                    <div id="sidebar-editors-container" class="sidebar-editors-stack">
                        </div>
                </section>

                <section class="tab-panel" id="tab-export">
                    <h2 class="panel-title">خيارات التصدير والطباعة</h2>
                    
                    <div class="export-actions-grid">
                        <button id="btn-print-doc" class="btn btn-export">
                            <i class="fa-solid fa-print"></i>
                            <div>
                                <strong>طباعة / حفظ PDF</strong>
                                <span>تنسيق A4 قياسي وجاهز للطباعة</span>
                            </div>
                        </button>

                        <button id="btn-export-html" class="btn btn-export">
                            <i class="fa-solid fa-code"></i>
                            <div>
                                <strong>تصدير كملف HTML مستقل</strong>
                                <span>ملف فردي يتضمن التنسيق الكامل والخطوط</span>
                            </div>
                        </button>

                        <button id="btn-export-json" class="btn btn-export">
                            <i class="fa-solid fa-file-arrow-down"></i>
                            <div>
                                <strong>تصدير النسخة الاحتياطية (JSON)</strong>
                                <span>حفظ بيانات اللائحة لإعادة الاستيراد لاحقاً</span>
                            </div>
                        </button>

                        <div class="import-box">
                            <label for="input-import-json" class="btn btn-export btn-outline">
                                <i class="fa-solid fa-file-arrow-up"></i>
                                <div>
                                    <strong>استيراد ملف بيانات (JSON)</strong>
                                    <span>تحميل مشروع سابق والتعديل عليه</span>
                                </div>
                            </label>
                            <input type="file" id="input-import-json" accept=".json" class="hidden-input">
                        </div>
                    </div>
                </section>

            </div>
        </aside>

        <main class="document-viewport" id="document-viewport">
            <div class="viewport-controls">
                <button id="btn-zoom-in" class="btn-icon-sm" title="تكبير"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                <button id="btn-zoom-out" class="btn-icon-sm" title="تصغير"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                <button id="btn-reset-zoom" class="btn-icon-sm" title="إعادة الضبط">100%</button>
            </div>

            <div class="a4-page-container" id="a4-paper">
                </div>
        </main>

    </div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://unpkg.com/pagedjs/dist/paged.polyfill.js"></script>

    <script type="module" src="src/js/app.js"></script>
</body>
</html>
