<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشئ النظام الأساسي واللوائح التنظيمية</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Paged.js Script for Advanced Pagination & Page Breaks -->
    <script src="https://unpkg.com/pagedjs/dist/paged.polyfill.js"></script>

    <!-- Application Stylesheet -->
    <link rel="stylesheet" href="./styles.css">
</head>
<body class="theme-auto">

    <!-- Top App Header -->
    <header class="app-header no-print">
        <div class="header-brand">
            <button id="sidebarToggle" class="btn-icon" aria-label="تبديل القائمة">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
            </button>
            <h1 class="app-title">منشئ النظام الأساسي للحسينيات والمآتم</h1>
        </div>
        
        <div class="header-actions">
            <div class="search-box">
                <input type="search" id="globalSearch" placeholder="بحث في المواد والأحكام..." aria-label="بحث">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            </div>
            
            <button id="themeToggle" class="btn-secondary" title="تبديل المظهر">
                <span class="theme-icon-light">☀️</span>
                <span class="theme-icon-dark">🌙</span>
            </button>
            
            <button id="printBtn" class="btn-primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>
                <span>طباعة / تصدير PDF</span>
            </button>
        </div>
    </header>

    <div class="app-layout">
        
        <!-- Sidebar Controls -->
        <aside id="sidebar" class="sidebar-panel no-print">
            <nav class="sidebar-tabs">
                <button class="tab-btn active" data-tab="meta">البيانات</button>
                <button class="tab-btn" data-tab="nav">الفهرس</button>
                <button class="tab-btn" data-tab="content">المحتوى</button>
                <button class="tab-btn" data-tab="io">الملفات</button>
            </nav>

            <div class="sidebar-content">
                <!-- Tab: Meta -->
                <section id="tab-meta" class="tab-pane active">
                    <h3>بيانات الحسينية / المأتم</h3>
                    <div class="form-group">
                        <label for="inputOrgName">اسم الحسينية / المأتم</label>
                        <input type="text" id="inputOrgName" value="حسينية الإمام علي (ع)">
                    </div>
                    <div class="form-group">
                        <label for="inputDocTitle">عنوان الوثيقة</label>
                        <input type="text" id="inputDocTitle" value="النظام الأساسي واللوائح التنظيمية">
                    </div>
                    <div class="form-group">
                        <label for="inputDocVersion">رقم الإصدار</label>
                        <input type="text" id="inputDocVersion" value="v1.0.0">
                    </div>
                    <div class="form-group">
                        <label for="inputDocDate">تاريخ الاعتماد</label>
                        <input type="date" id="inputDocDate">
                    </div>
                    <div class="form-group">
                        <label for="logoUploader">شعار الحسينية / المأتم</label>
                        <input type="file" id="logoUploader" accept="image/*">
                        <button id="removeLogoBtn" class="btn-danger-sm hidden">إزالة الشعار</button>
                    </div>
                </section>

                <!-- Tab: Outline Navigation -->
                <section id="tab-nav" class="tab-pane">
                    <h3>شجرة المستند</h3>
                    <div id="documentOutline" class="outline-tree"></div>
                </section>

                <!-- Tab: Content Editor -->
                <section id="tab-content" class="tab-pane">
                    <div class="pane-header">
                        <h3>إدارة أبواب ومواد النظام</h3>
                        <button id="addSectionBtn" class="btn-sm">+ إضافة باب</button>
                    </div>
                    <div id="editorAccordion" class="accordion-container"></div>
                </section>

                <!-- Tab: Import/Export -->
                <section id="tab-io" class="tab-pane">
                    <h3>تصدير واستيراد</h3>
                    <div class="io-actions">
                        <button id="exportJsonBtn" class="btn-outline">حفظ ملف البيانات JSON</button>
                        <button id="exportHtmlBtn" class="btn-outline btn-success">تصدير HTML مستقل</button>
                        <label for="importJsonInput" class="btn-outline custom-file-upload">استيراد JSON</label>
                        <input type="file" id="importJsonInput" accept=".json">
                    </div>
                </section>
            </div>
        </aside>

        <!-- Main Workspace Document Preview -->
        <main class="document-viewport">
            <div id="documentRender" class="a4-document">
                
                <!-- COVER PAGE -->
                <section class="doc-cover-page">
                    <div class="cover-content">
                        <div class="cover-logo-wrapper">
                            <img id="coverLogo" class="cover-main-logo" src="" alt="شعار المأتم">
                        </div>
                        <h1 id="renderOrgName" class="cover-org-title">حسينية الإمام علي (ع)</h1>
                        <div class="cover-divider"></div>
                        <h2 id="renderDocTitle" class="cover-doc-title">النظام الأساسي واللوائح التنظيمية</h2>
                        
                        <div class="cover-metadata-card">
                            <p><strong>رقم الإصدار:</strong> <span id="renderDocVersion">v1.0.0</span></p>
                            <p><strong>تاريخ الاعتماد:</strong> <span id="renderDocDate">—</span></p>
                        </div>
                    </div>
                </section>

                <!-- TABLE OF CONTENTS PAGE -->
                <section class="doc-toc-page">
                    <h2 class="section-toc-title">فهرس الأبواب والمواد</h2>
                    <div id="renderToc" class="toc-list"></div>
                </section>

                <!-- SECTIONS & ARTICLES CONTENT CONTAINER -->
                <div id="renderSectionsContainer" class="continuous-content"></div>

            </div>
        </main>
    </div>

    <!-- HTML Preview Modal -->
    <div id="previewModal" class="modal-backdrop hidden no-print">
        <div class="modal-container">
            <div class="modal-header">
                <h3>معاينة النسخة المستقلة (HTML)</h3>
                <button id="closeModalBtn" class="btn-icon">&times;</button>
            </div>
            <div class="modal-body">
                <iframe id="previewIframe" title="HTML Preview"></iframe>
            </div>
            <div class="modal-footer">
                <button id="confirmDownloadHtmlBtn" class="btn-primary">تحميل ملف HTML</button>
                <button id="cancelModalBtn" class="btn-secondary">إلغاء</button>
            </div>
        </div>
    </div>

    <script src="./app.js" defer></script>
</body>
</html>
